 <!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <section class="main-image">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
      <a class="main-image__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </section>
    <section class="centered-main-page-element">
      <p id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task" type="text">
          <button>Add</button>
        </div>
      </p>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li class="todo-item">
          <input class="todo-item__input-checkbox" type="checkbox">
          <label class="todo-item__label task">Pay Bills</label>
          <input type="text" class="todo-item__input-text task">
          <button class="todo-item__button-edit edit">Edit</button>
          <button class="todo-item__button-delete delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
        <li class="edit-mode">
          <input class="edit-mode__input-checkbox" type="checkbox">
          <label class="edit-mode__label task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="edit-mode__input-text task">
          <button class="edit-mode__button-save edit">Save</button>
          <button class="edit-mode__button-delete delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li class="completed-task">
          <input class="completed-task__input-checkbox" type="checkbox" checked>
          <label class="completed-task__label task">See the Doctor</label>
          <input type="text" class="completed-task__input-text task">
          <button class="completed-task__button-edit edit">Edit</button>
          <button class="completed-task__button-delete delete">
            <img src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
    </section>
  <script src="app.js"></script>
  </body>
</html>
